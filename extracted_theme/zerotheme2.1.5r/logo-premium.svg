<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Primary Gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Inner Circle with Glass Effect -->
  <circle cx="60" cy="60" r="48" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Shield Icon (Security Symbol) -->
  <g transform="translate(60,60)" filter="url(#glow)">
    <!-- Shield Base -->
    <path d="M0,-28 L24,-18 L24,8 C24,20 12,30 0,34 C-12,30 -24,20 -24,8 L-24,-18 Z" 
          fill="none" 
          stroke="white" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Checkmark Inside Shield -->
    <path d="M-10,2 L-4,10 L12,-8" 
          fill="none" 
          stroke="white" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Connection Lines (representing network/VPN) -->
    <g stroke="white" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
      <line x1="-30" y1="-8" x2="-24" y2="-8"/>
      <line x1="24" y1="-8" x2="30" y2="-8"/>
      <line x1="-28" y1="8" x2="-24" y2="4"/>
      <line x1="24" y1="4" x2="28" y2="8"/>
    </g>
    
    <!-- Network Nodes -->
    <g fill="white" opacity="0.8">
      <circle cx="-32" cy="-8" r="2"/>
      <circle cx="32" cy="-8" r="2"/>
      <circle cx="-30" cy="10" r="1.5"/>
      <circle cx="30" cy="10" r="1.5"/>
    </g>
  </g>
  
  <!-- Subtle Ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
</svg>
