<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Aurora Gradient -->
    <linearGradient id="auroraBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="30%" style="stop-color:#0f172a"/>
      <stop offset="70%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    
    <!-- Aurora Lights -->
    <linearGradient id="aurora1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </linearGradient>
    
    <linearGradient id="aurora2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#06b6d4;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Star Pattern -->
    <pattern id="stars" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="30" r="1" fill="rgba(255,255,255,0.5)"/>
      <circle cx="150" cy="80" r="0.5" fill="rgba(255,255,255,0.3)"/>
      <circle cx="30" cy="150" r="0.8" fill="rgba(255,255,255,0.4)"/>
      <circle cx="180" cy="170" r="0.5" fill="rgba(255,255,255,0.3)"/>
      <circle cx="100" cy="100" r="0.3" fill="rgba(255,255,255,0.2)"/>
    </pattern>
    
    <!-- Blur Filter -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="100%" height="100%" fill="url(#auroraBg)"/>
  
  <!-- Stars -->
  <rect width="100%" height="100%" fill="url(#stars)" opacity="0.8"/>
  
  <!-- Aurora Waves -->
  <g filter="url(#blur)">
    <ellipse cx="500" cy="300" rx="800" ry="200" fill="url(#aurora1)" opacity="0.6">
      <animate attributeName="cy" values="300;350;300" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="800;850;800" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    
    <ellipse cx="1400" cy="500" rx="600" ry="150" fill="url(#aurora2)" opacity="0.5">
      <animate attributeName="cy" values="500;450;500" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="600;650;600" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    
    <ellipse cx="960" cy="200" rx="500" ry="100" fill="rgba(168,85,247,0.2)" opacity="0.4">
      <animate attributeName="cy" values="200;250;200" dur="12s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Glowing Lines -->
  <g stroke="rgba(34,211,238,0.1)" fill="none" stroke-width="1">
    <path d="M0,600 Q400,500 800,550 T1600,500 T1920,550">
      <animate attributeName="d" 
        values="M0,600 Q400,500 800,550 T1600,500 T1920,550;
                M0,580 Q400,520 800,530 T1600,520 T1920,530;
                M0,600 Q400,500 800,550 T1600,500 T1920,550" 
        dur="15s" repeatCount="indefinite"/>
    </path>
    <path d="M0,700 Q500,650 1000,680 T1920,650">
      <animate attributeName="d" 
        values="M0,700 Q500,650 1000,680 T1920,650;
                M0,680 Q500,670 1000,660 T1920,670;
                M0,700 Q500,650 1000,680 T1920,650" 
        dur="18s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Subtle Vignette -->
  <rect width="100%" height="100%" fill="url(#vignette)"/>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.4)"/>
    </radialGradient>
  </defs>
</svg>
