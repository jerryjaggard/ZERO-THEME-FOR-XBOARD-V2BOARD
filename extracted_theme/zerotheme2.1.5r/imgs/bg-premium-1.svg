<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradient Definitions -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    
    <radialGradient id="glow1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="glow2" cx="70%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0"/>
    </radialGradient>
    
    <radialGradient id="glow3" cx="20%" cy="80%" r="35%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0"/>
    </radialGradient>
    
    <!-- Noise Pattern -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.05"/>
        <feFuncG type="linear" slope="0.05"/>
        <feFuncB type="linear" slope="0.05"/>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feBlend mode="overlay"/>
    </filter>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
    
    <!-- Animated Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.05)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  
  <!-- Base Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Glow Effects -->
  <rect width="100%" height="100%" fill="url(#glow1)"/>
  <rect width="100%" height="100%" fill="url(#glow2)"/>
  <rect width="100%" height="100%" fill="url(#glow3)"/>
  
  <!-- Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Decorative Elements -->
  <g opacity="0.6">
    <!-- Abstract Shapes -->
    <circle cx="200" cy="200" r="300" fill="none" stroke="rgba(99,102,241,0.1)" stroke-width="1"/>
    <circle cx="200" cy="200" r="350" fill="none" stroke="rgba(99,102,241,0.05)" stroke-width="1"/>
    <circle cx="200" cy="200" r="400" fill="none" stroke="rgba(99,102,241,0.03)" stroke-width="1"/>
    
    <circle cx="1700" cy="800" r="250" fill="none" stroke="rgba(139,92,246,0.1)" stroke-width="1"/>
    <circle cx="1700" cy="800" r="300" fill="none" stroke="rgba(139,92,246,0.05)" stroke-width="1"/>
    
    <circle cx="1400" cy="200" r="150" fill="none" stroke="rgba(34,211,238,0.08)" stroke-width="1"/>
    <circle cx="1400" cy="200" r="200" fill="none" stroke="rgba(34,211,238,0.04)" stroke-width="1"/>
  </g>
  
  <!-- Floating Particles -->
  <g opacity="0.5">
    <circle cx="100" cy="500" r="2" fill="#6366f1">
      <animate attributeName="cy" values="500;480;500" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="300" r="1.5" fill="#8b5cf6">
      <animate attributeName="cy" values="300;320;300" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="700" r="2" fill="#22d3ee">
      <animate attributeName="cy" values="700;680;700" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="400" r="1.5" fill="#6366f1">
      <animate attributeName="cy" values="400;420;400" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1500" cy="600" r="2" fill="#8b5cf6">
      <animate attributeName="cy" values="600;580;600" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1800" cy="300" r="1" fill="#22d3ee">
      <animate attributeName="cy" values="300;315;300" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="900" r="1.5" fill="#6366f1">
      <animate attributeName="cy" values="900;880;900" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="150" r="2" fill="#8b5cf6">
      <animate attributeName="cy" values="150;170;150" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Noise Texture Overlay -->
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.3"/>
</svg>
