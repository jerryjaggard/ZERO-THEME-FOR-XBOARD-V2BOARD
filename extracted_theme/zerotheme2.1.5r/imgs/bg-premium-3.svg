<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Ocean Gradient -->
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1929"/>
      <stop offset="50%" style="stop-color:#0f2744"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    
    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0"/>
    </linearGradient>
    
    <linearGradient id="wave2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0"/>
    </linearGradient>
    
    <linearGradient id="wave3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:0"/>
    </linearGradient>
    
    <!-- Caustics Pattern -->
    <pattern id="caustics" width="100" height="100" patternUnits="userSpaceOnUse">
      <ellipse cx="25" cy="25" rx="15" ry="10" fill="none" stroke="rgba(45,212,191,0.05)" stroke-width="0.5"/>
      <ellipse cx="75" cy="50" rx="20" ry="12" fill="none" stroke="rgba(14,165,233,0.05)" stroke-width="0.5"/>
      <ellipse cx="40" cy="80" rx="12" ry="8" fill="none" stroke="rgba(8,145,178,0.05)" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Base Background -->
  <rect width="100%" height="100%" fill="url(#oceanBg)"/>
  
  <!-- Caustics Overlay -->
  <rect width="100%" height="100%" fill="url(#caustics)">
    <animate attributeName="x" values="0;100;0" dur="20s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Wave Layers -->
  <g opacity="0.8">
    <!-- Wave 1 - Bottom -->
    <path fill="url(#wave1)">
      <animate attributeName="d" 
        values="M0,900 C200,850 400,920 600,880 C800,840 1000,900 1200,870 C1400,840 1600,890 1920,850 L1920,1080 L0,1080 Z;
                M0,880 C200,920 400,860 600,900 C800,860 1000,920 1200,880 C1400,920 1600,860 1920,900 L1920,1080 L0,1080 Z;
                M0,900 C200,850 400,920 600,880 C800,840 1000,900 1200,870 C1400,840 1600,890 1920,850 L1920,1080 L0,1080 Z" 
        dur="8s" repeatCount="indefinite"/>
    </path>
    
    <!-- Wave 2 - Middle -->
    <path fill="url(#wave2)">
      <animate attributeName="d" 
        values="M0,920 C300,880 500,950 800,900 C1100,850 1300,920 1500,880 C1700,840 1920,900 1920,870 L1920,1080 L0,1080 Z;
                M0,900 C300,940 500,880 800,920 C1100,880 1300,940 1500,900 C1700,940 1920,880 1920,910 L1920,1080 L0,1080 Z;
                M0,920 C300,880 500,950 800,900 C1100,850 1300,920 1500,880 C1700,840 1920,900 1920,870 L1920,1080 L0,1080 Z" 
        dur="10s" repeatCount="indefinite"/>
    </path>
    
    <!-- Wave 3 - Top -->
    <path fill="url(#wave3)">
      <animate attributeName="d" 
        values="M0,950 C400,920 600,980 900,940 C1200,900 1400,960 1700,920 C1850,900 1920,940 1920,930 L1920,1080 L0,1080 Z;
                M0,940 C400,970 600,920 900,960 C1200,940 1400,980 1700,950 C1850,970 1920,930 1920,960 L1920,1080 L0,1080 Z;
                M0,950 C400,920 600,980 900,940 C1200,900 1400,960 1700,920 C1850,900 1920,940 1920,930 L1920,1080 L0,1080 Z" 
        dur="12s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Bubbles -->
  <g opacity="0.4">
    <circle cx="150" cy="800" r="5" fill="rgba(45,212,191,0.3)">
      <animate attributeName="cy" values="800;100" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="900" r="3" fill="rgba(14,165,233,0.3)">
      <animate attributeName="cy" values="900;200" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="950" r="4" fill="rgba(8,145,178,0.3)">
      <animate attributeName="cy" values="950;150" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="870" r="3" fill="rgba(45,212,191,0.3)">
      <animate attributeName="cy" values="870;80" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1600" cy="920" r="5" fill="rgba(14,165,233,0.3)">
      <animate attributeName="cy" values="920;120" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="22s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Light Rays -->
  <g opacity="0.1">
    <polygon points="960,0 860,1080 1060,1080" fill="url(#lightRay)"/>
    <polygon points="400,0 300,1080 500,1080" fill="url(#lightRay)"/>
    <polygon points="1500,0 1400,1080 1600,1080" fill="url(#lightRay)"/>
  </g>
  <defs>
    <linearGradient id="lightRay" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
  </defs>
</svg>
