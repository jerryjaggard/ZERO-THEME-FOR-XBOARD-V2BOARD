  <script>
    // Theme Switcher Function
    function switchTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('premium-theme', theme);

    // Show theme switcher on triple-click anywhere
    document.addEventListener('click', function(e) {
      if (e.detail === 3) {
        const switcher = document.getElementById('theme-switcher');
        switcher.style.display = switcher.style.display === 'none' ? 'flex' : 'none';
      }
    });
    
    // Hide loading screen when app is ready
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.body.classList.add('app-loaded');
        document.body.style.overflow = 'auto';
      }, 500);
    });
  </script>

<script>
(function() {
  var API_URL = '/track-visit';

  function sendVisit() {
    try {
      var payload = {
        url: window.location.href,
        referrer: document.referrer || null,
        ua: navigator.userAgent,
        lang: navigator.language || navigator.userLanguage || null,
        // Optional for later: can be filled from your HTML if user info is available
        user_id: window.NETFLARE_USER_ID || null,
        email: window.NETFLARE_USER_EMAIL || null,
        plan: window.NETFLARE_USER_PLAN || null
      };

      if (navigator.sendBeacon) {
        var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
        navigator.sendBeacon(API_URL, blob);
      } else {
        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true
        });
      }
    } catch (e) {}
  }

  if (document.readyState === 'complete') {
    sendVisit();
  } else {
    window.addEventListener('load', sendVisit);
  }
})();
</script>
